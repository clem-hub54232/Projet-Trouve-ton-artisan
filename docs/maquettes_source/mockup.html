<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette Trouve ton artisan</title>
<style>
:root{--light:#f1f8fc;--blue:#0074c7;--deep:#00497c;--char:#384050;--red:#cd2c2e;--green:#82b864;--border:#dbe4ea}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--char);line-height:1.55;background:#fff}.container{width:min(1120px,calc(100% - 32px));margin:auto}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:5}.headerin{min-height:84px;display:flex;align-items:center;gap:22px}.logo{width:230px}.nav{display:flex;gap:18px;margin-left:auto;align-items:center}.nav a{color:var(--char);text-decoration:none;font-weight:700;font-size:14px}.search{display:flex;gap:8px}.search input{width:210px;border:1px solid #bdcad3;border-radius:7px;padding:10px 12px}.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border:0;border-radius:7px;padding:11px 16px;font-weight:700}.hero{background:linear-gradient(145deg,var(--light),#fff 72%);padding:72px 0}.hero-grid{display:grid;grid-template-columns:1.4fr .7fr;gap:42px;align-items:center}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:800;font-size:12px}.hero h1,.page h1{font-size:54px;line-height:1.06;letter-spacing:-.03em;margin:8px 0 18px}.lead{font-size:19px;color:#606978;max-width:670px}.hero-panel{background:var(--deep);color:#fff;padding:26px;border-radius:20px}.hero-panel a{display:block;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:13px 15px;margin:9px 0;font-weight:700}.section{padding:64px 0}.alt{background:var(--light)}.section h2{font-size:34px;margin:5px 0 28px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.step{border:1px solid var(--border);border-radius:15px;padding:18px;background:#fff}.num{width:38px;height:38px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-weight:800}.step h3{font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--border);border-radius:16px;padding:22px;background:#fff}.avatar{width:54px;height:54px;border-radius:14px;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:800}.card h3{font-size:20px;margin:15px 0 6px}.stars{color:#e1a100;letter-spacing:.06em}.spec{color:var(--deep);font-weight:700}.muted{color:#677181}.page{padding:56px 0 76px}.page h1{font-size:46px}.detail{display:grid;grid-template-columns:1.5fr .8fr;gap:34px}.profile{display:flex;align-items:center;gap:20px}.avatar.big{width:84px;height:84px;border-radius:22px;font-size:24px}.block{border-top:1px solid var(--border);padding:22px 0}.contact{background:var(--light);border:1px solid var(--border);border-radius:17px;padding:24px}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #bccbd4;border-radius:7px;padding:11px;background:#fff}.legalbox{padding:28px;background:var(--light);border-left:5px solid var(--blue);border-radius:12px;max-width:760px}.notfound{text-align:center;padding:90px 0}.big404{font-size:140px;font-weight:900;line-height:1;color:var(--light);text-shadow:2px 2px var(--deep)}.footer{background:var(--char);color:white;padding:38px 0}.footer-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.footer a{color:#fff}.menu{display:none}
@media(max-width:900px){.container{width:min(100% - 28px,760px)}.headerin{flex-wrap:wrap;padding:12px 0}.logo{width:210px}.nav{display:none}.menu{display:block;margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:7px;padding:8px 12px}.hero{padding:48px 0}.hero-grid{grid-template-columns:1fr}.hero h1,.page h1{font-size:42px}.steps{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.container{width:calc(100% - 24px)}.headerin{min-height:70px}.logo{width:185px}.hero{padding:38px 0}.hero h1,.page h1{font-size:36px}.lead{font-size:17px}.search{flex-direction:column}.search input{width:100%}.steps,.cards{grid-template-columns:1fr}.section{padding:46px 0}.section h2{font-size:28px}.detail{display:block}.contact{margin-top:28px}.profile{align-items:flex-start}.footer-grid{grid-template-columns:1fr}.big404{font-size:100px}}
</style>
</head>
<body>
<header class="header"><div class="container headerin"><img class="logo" src="Logo.png" alt="Trouve ton artisan"><button class="menu">☰</button><nav class="nav"><a>Bâtiment</a><a>Services</a><a>Fabrication</a><a>Alimentation</a><div class="search"><input placeholder="Rechercher un artisan"><button class="btn">Rechercher</button></div></nav></div></header>
<main id="app"></main>
<footer class="footer"><div class="container footer-grid"><div><strong>Région Auvergne-Rhône-Alpes</strong><p>101 cours Charlemagne<br>CS 20033<br>69269 Lyon Cedex 02<br>France<br>+33 (0)4 26 73 40 00</p></div><div><strong>Informations</strong><p><a>Mentions légales</a><br><a>Données personnelles</a><br><a>Accessibilité</a><br><a>Cookies</a></p></div></div></footer>
<script>
const params=new URLSearchParams(location.search);const page=params.get('page')||'home';
const artisans=[
{name:'Au pain chaud',s:'Boulanger',r:'4.8',c:'Montélimar',i:'AP'},
{name:'Chocolaterie Labbé',s:'Chocolatier',r:'4.9',c:'Lyon',i:'CL'},
{name:'Orville Salmons',s:'Chauffagiste',r:'5.0',c:'Evian',i:'OS'},
{name:'Mont Blanc Eléctricité',s:'Electricien',r:'4.5',c:'Chamonix',i:'MB'},
{name:'Boutot & fils',s:'Menuisier',r:'4.7',c:'Bourg-en-bresse',i:'BF'},
{name:'Vallis Bellemare',s:'Plombier',r:'4.0',c:'Vienne',i:'VB'}];
function cards(list=artisans){return `<div class="cards">${list.map(a=>`<article class="card"><div class="avatar">${a.i}</div><h3>${a.name}</h3><div class="stars">★★★★★ <span class="muted">${a.r}/5</span></div><p class="spec">${a.s}</p><p class="muted">${a.c}</p></article>`).join('')}</div>`}
const app=document.getElementById('app');
if(page==='home')app.innerHTML=`<section class="hero"><div class="container hero-grid"><div><div class="eyebrow">Avec la région Auvergne-Rhône-Alpes</div><h1>Trouvez l'artisan qu'il vous faut, près de chez vous.</h1><p class="lead">Recherchez un professionnel par nom ou explorez les métiers de l'alimentation, du bâtiment, de la fabrication et des services.</p><div class="search"><input placeholder="Rechercher un artisan"><button class="btn">Rechercher</button></div></div><div class="hero-panel"><h2>Explorer les catégories</h2><a>Bâtiment →</a><a>Services →</a><a>Fabrication →</a><a>Alimentation →</a></div></div></section><section class="section"><div class="container"><div class="eyebrow">Simple et rapide</div><h2>Comment trouver mon artisan ?</h2><div class="steps"><div class="step"><div class="num">1</div><h3>Choisir la catégorie d'artisanat dans le menu.</h3></div><div class="step"><div class="num">2</div><h3>Choisir un artisan.</h3></div><div class="step"><div class="num">3</div><h3>Le contacter via le formulaire de contact.</h3></div><div class="step"><div class="num">4</div><h3>Une réponse sera apportée sous 48h.</h3></div></div></div></section><section class="section alt"><div class="container"><div class="eyebrow">Sélection régionale</div><h2>Les artisans du mois</h2>${cards(artisans.slice(0,3))}</div></section>`;
if(page==='list')app.innerHTML=`<section class="page"><div class="container"><div class="eyebrow">Catégorie</div><h1>Bâtiment</h1><p class="lead">Choisissez un professionnel puis consultez sa fiche complète.</p>${cards(artisans.slice(2))}</div></section>`;
if(page==='detail')app.innerHTML=`<section class="page"><div class="container detail"><article><div class="eyebrow">Fiche artisan</div><div class="profile"><div class="avatar big">OS</div><div><h1 style="margin:0;font-size:42px">Orville Salmons</h1><div class="stars">★★★★★ <span class="muted">5.0/5</span></div><p><strong>Chauffagiste</strong> · Evian</p></div></div><div class="block"><h2>À propos</h2><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus eleifend ante sem, id volutpat massa fermentum nec. Praesent volutpat scelerisque mauris, quis sollicitudin tellus sollicitudin.</p></div></article><aside class="contact"><h2>Contacter cet artisan</h2><p>Envoyez votre demande. Une réponse est attendue sous 48h.</p><div class="field"><label>Nom</label><input></div><div class="field"><label>E-mail</label><input></div><div class="field"><label>Objet</label><input></div><div class="field"><label>Message</label><textarea rows="6"></textarea></div><button class="btn" style="width:100%">Envoyer ma demande</button></aside></div></section>`;
if(page==='legal')app.innerHTML=`<section class="page"><div class="container"><div class="eyebrow">Information</div><h1>Mentions légales</h1><div class="legalbox"><h2>Page en construction</h2><p>Le contenu de cette page sera complété ultérieurement par le cabinet spécialisé.</p></div></div></section>`;
if(page==='404')app.innerHTML=`<section class="notfound"><div class="container"><div class="big404">404</div><h1>Page non trouvée</h1><p>La page que vous avez demandée n'existe pas ou a été déplacée.</p><a class="btn">Retourner à l'accueil</a></div></section>`;
</script>
</body></html>
